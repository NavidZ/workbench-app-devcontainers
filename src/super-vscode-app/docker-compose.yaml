services:
  app:
    container_name: "application-server"
    image: "us-central1-docker.pkg.dev/vwb-dev-genial-pecan-2179/navid-repo/base-image:2.4.1"
    restart: always
    volumes:
      - .:/workspace:cached
      - work:/home/user:cached
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "8080:8080"
    networks:
      - app-network
    cap_add:
      - SYS_ADMIN
      - SYS_BOOT
    devices:
      - /dev/fuse
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /tmp
      - /run
      - /run/lock
networks:
  app-network:
    external: true
volumes:
  work:
